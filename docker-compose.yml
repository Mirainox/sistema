version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: mirainox_db
    restart: always
    environment:
      POSTGRES_USER: mirainox
      POSTGRES_PASSWORD: mirainox123
      POSTGRES_DB: mirainox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
